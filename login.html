<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in - GetHub</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: linear-gradient(
        135deg,
        #ff0080,
        #7928ca,
        #00c6ff,
        #00ff99,
        #ffcc00,
        #ff0080
    );
    background-size: 400% 400%;
    animation: bg 8s ease infinite;
    color: white;
}
@keyframes bg {
    0% {background-position: 0% 50%;}
    25% {background-position: 100% 0%;}
    50% {background-position: 100% 100%;}
    75% {background-position: 0% 100%;}
    100% {background-position: 0% 50%;}
}
.glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .6;
    animation: float 6s infinite alternate;
    pointer-events: none;
}
.glow.one {
    background: #a100ff;
    top: 5%;
    left: 5%;
}
.glow.two {
    background: #00d9ff;
    bottom: 5%;
    right: 5%;
}
@keyframes float {
    from {transform: translateY(-30px);}
    to {transform: translateY(50px);}
}
/* LOGIN PAGE */
.login-box {
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 390px;
    padding: 40px 30px;
    background: rgba(255,255,255,.12);
    border: 2px solid rgba(20,10,45,.85);
    border-radius: 25px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 40px rgba(0,0,0,.35);
    text-align: center;
    animation: appear 1s ease;
}
@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
.logo {
    font-size: 45px;
    margin-bottom: 10px;
    color: #ffffff;
    filter: drop-shadow(0 0 12px #00d9ff);
}
.email {
    color: #ffffff;
    font-size: 15px;
    margin-bottom: 18px;
    letter-spacing: 1px;
}
h1 {
    font-size: 30px;
    margin-bottom: 8px;
    background: linear-gradient(90deg,#00eaff,#d66aff);
    -webkit-background-clip: text;
    color: transparent;
}
.subtitle {
    color: #ffffff;
    font-size: 13px;
    margin-bottom: 30px;
}
.input-box {
    position: relative;
    margin: 18px 0;
}
.input-box input {
    width: 100%;
    padding: 15px;
    border: 2px solid rgba(20,10,45,.85);
    border-radius: 12px;
    outline: none;
    color: white;
    background: rgba(255,255,255,.12);
    font-size: 14px;
    transition: .3s;
}
.input-box input:focus {
    border-color: #00eaff;
    box-shadow: 0 0 15px rgba(0,234,255,.3);
}
.input-box input::placeholder {
    color: #ffffff;
}
.show {
    position: absolute;
    right: 14px;
    top: 15px;
    cursor: pointer;
    font-size: 13px;
    color: #00eaff;
}
.options {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin: 15px 0 22px;
    color: #ffffff;
}
a {
    color: #00eaff;
    text-decoration: none;
}
.login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    color: #080020;
    background: linear-gradient(90deg,#00eaff,#bd55ff);
    cursor: pointer;
    transition: .3s;
}
.login-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 25px #00d9ff;
}
.signup {
    margin-top: 25px;
    color: #ffffff;
    font-size: 13px;
}
.footer {
    margin-top: 25px;
    font-size: 11px;
    color: #ffffff;
}
</style>
</head>
<body data-page="login">
<div class="glow one"></div>
<div class="glow two"></div>
<!-- LOGIN PAGE -->
<div class="login-box" id="loginPage">
    <div class="logo">✦</div>
    <div class="email">
        Email: yourname@example.com
    </div>
    <h1>WELCOME BACK</h1>
    <p class="subtitle">
        Login to your account and explore something amazing.
    </p>
    <form id="loginForm">
        <div class="input-box">
            <input type="text"
            id="username"
            placeholder="Enter Username or Email"
            required>
        </div>
        <div class="input-box">
            <input type="password"
            id="password"
            placeholder="Enter Password"
            required>
            <span class="show" onclick="togglePassword()">
                SHOW
            </span>
        </div>
        <div class="options">
            <label>
                <input type="checkbox">
                Remember me
            </label>
            <a href="#">Forgot Password?</a>
        </div>
        <button class="login-btn" type="submit">
            LOGIN NOW →
        </button>
    </form>
    <div class="signup">
        Don't have an account?
        <a href="signup.html">Create Account</a>
    </div>
    <div class="footer">
        © 2026 GetHub. All Rights Reserved.
    </div>
</div>
<script>
/* SHOW AND HIDE PASSWORD */
function togglePassword() {
    let pass = document.getElementById("password");
    let btn = document.querySelector(".show");
    if (pass.type === "password") {
        pass.type = "text";
        btn.innerText = "HIDE";
    } else {
        pass.type = "password";
        btn.innerText = "SHOW";
    }
}
</script>
<script src="js/app.js"></script>
</body>
</html>
