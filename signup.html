<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up - GetHub</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth" data-page="signup">
<div class="glow one"></div>
<div class="glow two"></div>
<div class="auth-box glass">
  <div class="logo">✦</div>
  <h1>JOIN GETHUB</h1>
  <p class="subtitle">Create an account to upload and download.</p>
  <form id="authForm">
    <div class="field"><input id="username" required placeholder="Choose a username" aria-label="Username"></div>
    <div class="field"><input id="password" type="password" required minlength="8" placeholder="Password (8+ characters)" aria-label="Password"></div>
    <div class="field"><input id="password2" type="password" required placeholder="Repeat password" aria-label="Repeat password"></div>
    <button class="btn" type="submit">CREATE ACCOUNT</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <div class="signup">Already have an account? <a href="login.html">Log in</a></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
