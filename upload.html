<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload - GetHub</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="upload">
<div class="glow one"></div>
<div class="glow two"></div>
<div class="wrap">
<div id="nav"></div>
<main>
<h1 class="title">Upload</h1>
<p class="lead">Add a tool, script, APK or API for others to download.</p>
<form id="uploadForm" class="panel glass" style="max-width:620px">
  <div class="field"><label for="name">Name</label><input id="name" required maxlength="60" placeholder="Example: Log Reader"></div>
  <div class="field"><label for="type">Type</label>
    <select id="type"><option value="tool">Tool</option><option value="script">Script</option><option value="apk">APK</option><option value="api">API</option></select></div>
  <div class="field"><label for="ver">Version</label><input id="ver" maxlength="12" placeholder="1.0.0"></div>
  <div class="field"><label for="desc">What does it do?</label><textarea id="desc" required maxlength="600" placeholder="Describe it in a few plain sentences"></textarea></div>
  <div class="field"><label for="file">File</label><input id="file" type="file"></div>
  <div class="field"><label><input type="checkbox" required> I made this or have permission to share it, and it is not malware.</label></div>
  <button class="btn" type="submit">Publish</button>
  <p class="muted" style="margin-top:12px">Demo mode: only the details are saved in your browser. The file itself is not stored until a backend is added.</p>
</form>
</main>
<div class="foot" id="foot"></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
